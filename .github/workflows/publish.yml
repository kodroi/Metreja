name: Publish to NuGet

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.2
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.2

      - name: Display version
        run: echo "Publishing version ${{ steps.gitversion.outputs.semVer }}"

      - name: Stamp changelog version
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          if grep -Fq "## [$VERSION] " CHANGELOG.md; then
            exit 0
          fi
          DATE=$(date +%Y-%m-%d)
          sed -i "s/^## Unreleased$/## Unreleased\n\n## [$VERSION] — $DATE/" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || (git commit -m "docs: stamp changelog v$VERSION" && git push)

      - name: Download Windows profiler from latest CI
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: build-and-test.yml
          commit: ${{ github.sha }}
          name: profiler-windows
          path: bin/Release

      - name: Download macOS profiler from latest CI
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: build-and-test.yml
          commit: ${{ github.sha }}
          name: profiler-macos
          path: bin/Release

      - name: Verify native binaries
        run: |
          ls -la bin/Release/
          test -f bin/Release/Metreja.Profiler.dll
          test -f bin/Release/libMetreja.Profiler.dylib

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build Metreja.Tool
        run: dotnet build src/Metreja.Tool/Metreja.Tool.csproj -c Release --no-restore /p:PostHogApiKey=${{ secrets.POSTHOG_API_KEY }}

      - name: Pack NuGet package
        run: dotnet pack src/Metreja.Tool/Metreja.Tool.csproj -c Release --no-build -o artifacts /p:PackageVersion=${{ steps.gitversion.outputs.semVer }}

      - name: Inspect package contents
        run: |
          target_frameworks=$(dotnet msbuild src/Metreja.Tool/Metreja.Tool.csproj -nologo -getProperty:TargetFrameworks)
          test -n "$target_frameworks"
          IFS=';' read -r -a frameworks <<< "$target_frameworks"
          for f in artifacts/*.nupkg; do
            echo "=== $f ==="
            entries=$(unzip -Z1 "$f")
            for framework in "${frameworks[@]}"; do
              grep -Fx "tools/$framework/any/Metreja.Profiler.dll" <<< "$entries"
              grep -Fx "tools/$framework/any/libMetreja.Profiler.dylib" <<< "$entries"
            done
          done

      - name: Sign in to NuGet.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: iirorahkonen

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.gitversion.outputs.semVer }}" artifacts/*.nupkg --title "v${{ steps.gitversion.outputs.semVer }}" --generate-notes
